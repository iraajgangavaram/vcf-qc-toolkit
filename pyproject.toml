[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-qc-toolkit"
version = "0.2.0"
description = "Dependency-free VCF quality control (Ti/Tv, exact Hardy-Weinberg test, sample outlier detection) validated on simulated data with planted artefacts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
figures = ["matplotlib"]

[project.scripts]
vcfqc = "vcfqc.cli:main"

[tool.setuptools]
packages = ["vcfqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
