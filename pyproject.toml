[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-qc-toolkit"
version = "0.1.0"
description = "Dependency-free quality-control summaries for VCF files: Ti/Tv, variant types, allele frequencies, per-sample genotypes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vcfqc = "vcfqc.cli:main"

[tool.setuptools]
packages = ["vcfqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
